openapi: 3.0.3
info:
  title: Mitti and Miles API
  version: 0.4.0
  description: >
    Phase 4 contract. Trip requests, host offers, slot holds, and booking
    transitions are implemented. Accepting an offer or creating a booking
    snapshots server-side price and terms and leaves payment.state NOT_STARTED.
    There is no client call that confirms payment. Discovery, host onboarding,
    and the account seam remain. Object storage is not configured. Development
    tokens are `Bearer dev:<provider>:<subject>` and are accepted only when the
    API process is in development authentication mode. A listing is bookable
    only when it is published, its host is verified and publicly visible, and
    its city is active.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: The API process is running. This does not check the database.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Signed-in account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account loaded from the server. Roles are not taken from the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchMe
      summary: Update the signed-in locale
      description: Rejects role, account status, and any other field.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMe"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/users/{userId}:
    get:
      operationId: getUser
      summary: Read an account
      description: >
        The account holder may read their own record. A staff grant of
        user.read may read another account's id and status. That staff read
        is audited. Client role headers are ignored.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Own account, or a minimal staff view.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Me"
                  - $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/cities:
    get:
      operationId: listCities
      summary: Active cities
      description: Inactive cities are omitted. Adding a city is an admin data change.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of active cities.
  /api/v1/languages:
    get:
      operationId: listLanguages
      summary: Active languages
      responses:
        "200":
          description: Page of active languages.
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: Active experience categories
      responses:
        "200":
          description: Page of active categories.
  /api/v1/experiences:
    get:
      operationId: listExperiences
      summary: Discover published listings
      description: >
        Returns published listings whose host is verified and publicly visible
        and whose city is active. verifiedHost=false does not reveal other listings.
        A date is interpreted in the city time zone.
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: category
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: integer }
        - name: maxPrice
          in: query
          schema: { type: integer }
        - name: minDuration
          in: query
          schema: { type: integer }
        - name: maxDuration
          in: query
          schema: { type: integer }
        - name: partySize
          in: query
          schema: { type: integer }
        - name: verifiedHost
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of bookable listings. Contact details are omitted.
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/experiences/{id}:
    get:
      operationId: getExperience
      summary: Public listing detail
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Bookable listing. Unpublished listings are not found.
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/experiences/{id}/availability:
    get:
      operationId: getExperienceAvailability
      summary: Open slots for a bookable listing
      description: Remaining seats subtract active, unexpired holds from configured capacity.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Open slots inside the date range.
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/hosts/{id}:
    get:
      operationId: getPublicHost
      summary: Public host profile
      description: Only a verified, visible host. No email, phone, documents, or payout data.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Public profile.
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/hosts/onboarding:
    post:
      operationId: submitHostOnboarding
      summary: Create or update the signed-in host profile
      description: Requires the HOST role. Cannot set verification or payout fields.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification state after the update.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/hosts/me/verification:
    get:
      operationId: getOwnVerification
      summary: Signed-in host verification state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status, note, and document metadata. Storage references are omitted.
  /api/v1/hosts/me/documents:
    post:
      operationId: allocateHostDocument
      summary: Allocate a private identity-document reference
      description: Does not accept file bytes. Upload is unavailable until object storage is configured.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Document metadata and an unavailable upload.
  /api/v1/hosts/me/experiences:
    post:
      operationId: createExperience
      summary: Create a draft listing owned by the signed-in host
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Draft listing. listingStatus cannot be supplied by the client.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/hosts/me/experiences/{id}:
    patch:
      operationId: updateExperience
      summary: Edit an owned draft or rejected listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated listing.
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/hosts/me/experiences/{id}/submit:
    post:
      operationId: submitExperience
      summary: Send an owned listing for review
      description: Requires a verified host and an active city. Does not publish.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Listing is in review.
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/hosts/me/experiences/{id}/availability:
    put:
      operationId: replaceAvailability
      summary: Replace slots and blackout periods for an owned listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Replacement schedule. Slot length must match the listing duration.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/admin/cities:
    post:
      operationId: createCity
      summary: Add an inactive city
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Inactive city. Activation is a separate audited action.
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/cities/{id}/activation:
    post:
      operationId: setCityActivation
      summary: Activate or deactivate a city
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated city. A change is audited with the supplied reason.
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/hosts/{hostId}/verification:
    post:
      operationId: decideHostVerification
      summary: Approve, reject, or request more host information
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated verification state. A change is audited.
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/hosts/{hostId}/documents:
    get:
      operationId: reviewHostDocuments
      summary: Read private document metadata
      description: Returns an unconfigured access descriptor. No document bytes.
      security:
        - bearerAuth: []
      parameters:
        - name: hostId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audited document metadata.
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/experiences/{id}/moderation:
    post:
      operationId: moderateExperience
      summary: Publish, reject, unpublish, or archive a listing
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated listing. Publish still requires a bookable host and active city.
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/trip-requests:
    post:
      operationId: createTripRequest
      summary: Submit a trip request
      description: >
        Requires Idempotency-Key. The same key and body return the original
        request. The server sets expiry. Price is not accepted from the client.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Request created.
        "200":
          description: Idempotent replay of the original request.
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/trip-requests/{id}/offers:
    post:
      operationId: createOffer
      summary: Host submits one pending offer
      description: >
        Eligible hosts are verified, publicly visible, and have a published
        listing in the request city. The offer price is the total for the
        requested party. Acceptance is a separate call.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Offer created.
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/offers/{id}/accept:
    post:
      operationId: acceptOffer
      summary: Traveller accepts an offer
      description: >
        Freezes price, commission snapshot, and cancellation terms into a
        booking in AWAITING_PAYMENT. Does not mark payment successful. Expired
        offers are rejected.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Booking created and awaiting payment.
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/bookings:
    post:
      operationId: createBooking
      summary: Reserve a published slot
      description: >
        Requires Idempotency-Key. The server copies the listing price as the
        booking total and ignores any client price. Party size reserves seats.
        The hold expires. payment.state is NOT_STARTED. Concurrent last-seat
        attempts cannot both succeed.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Booking awaiting payment, with a slot hold.
        "200":
          description: Idempotent replay.
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/bookings/{id}/complete:
    post:
      operationId: completeBooking
      summary: Host completes a booking
      description: >
        Idempotent when the booking is already completed. Invalid source
        states fail. This does not confirm payment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Booking completed, or the existing completed booking.
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Development tokens are accepted only in development authentication mode.
        JWT access tokens are accepted when JWT authentication is configured.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
  responses:
    Error:
      description: Safe error envelope. No stack trace or provider payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
    Me:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - accountStatus
        - locale
        - roles
        - adminAccess
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - CLOSED
        locale:
          type: string
        roles:
          type: array
          items:
            type: string
        adminAccess:
          type: boolean
          description: Derived on the server for navigation only. Every later admin action is checked again.
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - accountStatus
      properties:
        id:
          type: string
          format: uuid
        accountStatus:
          type: string
    PatchMe:
      type: object
      additionalProperties: false
      required:
        - locale
      properties:
        locale:
          type: string
          example: en-IN
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
