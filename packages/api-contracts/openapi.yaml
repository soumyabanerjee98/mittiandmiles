openapi: 3.0.3
info:
  title: Mitti and Miles API
  version: 0.2.0
  description: >
    Phase 2 contract. Health, the authenticated account seam, and the error
    envelope are implemented. Register, login, bookings, and payment capture
    are not. The identity provider is not selected. Development tokens are
    `Bearer dev:<provider>:<subject>` and are accepted only when the API
    process is in development authentication mode.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process health
      responses:
        "200":
          description: The API process is running. This does not check the database.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/me:
    get:
      operationId: getMe
      summary: Signed-in account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account loaded from the server. Roles are not taken from the client.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchMe
      summary: Update the signed-in locale
      description: Rejects role, account status, and any other field.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMe"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/users/{userId}:
    get:
      operationId: getUser
      summary: Read an account
      description: >
        The account holder may read their own record. A staff grant of
        user.read may read another account's id and status. That staff read
        is audited. Client role headers are ignored.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Own account, or a minimal staff view.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Me"
                  - $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Development seam only. Production authentication is unconfigured
        until an identity provider is selected.
  responses:
    Error:
      description: Safe error envelope. No stack trace or provider payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
    Me:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - accountStatus
        - locale
        - roles
        - adminAccess
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        accountStatus:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - CLOSED
        locale:
          type: string
        roles:
          type: array
          items:
            type: string
        adminAccess:
          type: boolean
          description: Derived on the server for navigation only. Every later admin action is checked again.
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - accountStatus
      properties:
        id:
          type: string
          format: uuid
        accountStatus:
          type: string
    PatchMe:
      type: object
      additionalProperties: false
      required:
        - locale
      properties:
        locale:
          type: string
          example: en-IN
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
